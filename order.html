<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="فندق أوز بارك - خدمة الطلبات / OZ Park Hotel - Dining Selection">
  <title>فندق أوز بارك | OZ Park Hotel</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Cairo:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --color-navy: #1B365D;
      --color-navy-dark: #0F2038;
      --color-navy-deep: #08111E;
      --color-gold: #C5A059;
      --color-gold-light: #E0C287;
      --color-gold-hover: #D8B46E;
      --color-white: #FFFFFF;
      --font-arabic: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-english: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      min-height: 100dvh;
    }

    body {
      font-family: var(--font-arabic);
      background-color: var(--color-navy-deep);
      color: var(--color-white);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    html[lang="en"] body {
      font-family: var(--font-english);
    }

    /* Ambient Background */
    .portal-bg {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 50% 35%, rgba(27, 54, 93, 0.65) 0%, rgba(8, 17, 30, 0.94) 85%),
        url('assets/images/hero-lounge.jpg') center/cover no-repeat;
      z-index: 0;
      filter: brightness(0.85);
      pointer-events: none;
    }

    /* Subtle Gold Glow */
    .portal-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(197, 160, 89, 0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    /* Top Bar - Minimal & Clean */
    .portal-header {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1000px;
      padding: 1rem 1.25rem 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hotel-location-tag {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 0.3px;
    }

    .lang-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: var(--color-white);
      padding: 0.35rem 0.85rem;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .lang-btn:hover, .lang-btn:active {
      background: rgba(197, 160, 89, 0.2);
      border-color: var(--color-gold);
      color: var(--color-gold-light);
    }

    /* Center Content Container */
    .portal-main {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 520px;
      padding: 1rem 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin: auto 0;
    }

    /* Hotel Branding */
    .brand-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 2rem;
    }

    .hotel-logo-box {
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hotel-logo-img {
      max-width: 220px;
      width: 62vw;
      height: auto;
      filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.6));
      transition: transform 0.3s ease;
    }

    .hotel-stars {
      color: var(--color-gold);
      font-size: 0.85rem;
      letter-spacing: 3px;
      margin-bottom: 0.4rem;
      display: block;
      opacity: 0.95;
    }

    .hotel-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--color-white);
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
      line-height: 1.2;
    }

    html[lang="en"] .hotel-title {
      font-family: var(--font-serif);
      font-size: 1.55rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    /* Two Buttons Side by Side (Grid of 2) */
    .action-buttons-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin: 0 auto;
    }

    .portal-btn {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.15rem 0.5rem;
      border-radius: 16px;
      text-decoration: none;
      transition: all 0.25s cubic-bezier(0.165, 0.84, 0.44, 1);
      cursor: pointer;
      user-select: none;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);
      border: 1px solid transparent;
      outline: none;
    }

    .portal-btn:active {
      transform: scale(0.97);
    }

    .portal-btn-icon {
      font-size: 1.9rem;
      line-height: 1;
      margin-bottom: 0.55rem;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
    }

    .portal-btn-text {
      font-size: clamp(0.8rem, 3.2vw, 1.05rem);
      font-weight: 700;
      line-height: 1.25;
      text-align: center;
    }

    /* Button 1: Café (Luxury Gold Theme) */
    .btn-cafe {
      background: linear-gradient(135deg, #C5A059 0%, #A2803D 100%);
      color: #0A1424;
      border-color: rgba(255, 235, 180, 0.4);
      box-shadow: 0 8px 22px rgba(197, 160, 89, 0.3);
    }

    .btn-cafe:hover {
      background: linear-gradient(135deg, #D8B46E 0%, #B6924A 100%);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(197, 160, 89, 0.45);
    }

    /* Button 2: Restaurant (Luxury Navy Theme with Gold Border) */
    .btn-restaurant {
      background: linear-gradient(135deg, rgba(27, 54, 93, 0.88) 0%, rgba(15, 32, 56, 0.96) 100%);
      color: var(--color-white);
      border-color: rgba(197, 160, 89, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
    }

    .btn-restaurant:hover {
      background: linear-gradient(135deg, rgba(36, 70, 117, 0.95) 0%, rgba(20, 42, 74, 1) 100%);
      border-color: var(--color-gold);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(27, 54, 93, 0.5);
    }

    /* Footer */
    .portal-footer {
      position: relative;
      z-index: 10;
      width: 100%;
      text-align: center;
      padding: 0.75rem 1rem 1rem;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.45);
    }

    /* Language display switchers */
    [lang="en"] .lang-ar { display: none !important; }
    [lang="ar"] .lang-en { display: none !important; }

    /* Desktop View Polish */
    @media (min-width: 600px) {
      .hotel-logo-img {
        max-width: 250px;
      }
      .hotel-title {
        font-size: 1.85rem;
      }
      .brand-section {
        margin-bottom: 2.25rem;
      }
      .action-buttons-row {
        gap: 16px;
      }
      .portal-btn {
        padding: 1.35rem 1rem;
        border-radius: 18px;
      }
      .portal-btn-icon {
        font-size: 2.2rem;
        margin-bottom: 0.65rem;
      }
      .portal-btn-text {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Background -->
  <div class="portal-bg"></div>

  <!-- Minimal Header -->
  <header class="portal-header">
    <div class="hotel-location-tag">
      <span class="lang-ar">القنفذة</span>
      <span class="lang-en">Al Qunfudhah</span>
    </div>

    <button id="lang-switch-btn" class="lang-btn" aria-label="Switch Language">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
      <span class="lang-ar">English</span>
      <span class="lang-en">العربية</span>
    </button>
  </header>

  <!-- Main Center Content -->
  <main class="portal-main">
    
    <!-- Hotel Branding -->
    <div class="brand-section">
      <div class="hotel-logo-box">
        <img src="assets/images/oz-park-logo-darkmode.png" alt="OZ Park Hotel | فندق أوز بارك" class="hotel-logo-img">
      </div>

      <span class="hotel-stars">★★★★★</span>

      <h1 class="hotel-title">
        <span class="lang-ar">فندق أوز بارك</span>
        <span class="lang-en">OZ Park Hotel</span>
      </h1>
    </div>

    <!-- Two Small Buttons Side by Side (Left & Right) -->
    <div class="action-buttons-row">
      
      <!-- Café Button -->
      <a href="/menu" class="portal-btn btn-cafe" id="btn-cafe-choice">
        <span class="portal-btn-icon">☕</span>
        <span class="portal-btn-text">
          <span class="lang-ar">اطلب من المقهى</span>
          <span class="lang-en">Order from Café</span>
        </span>
      </a>

      <!-- Restaurant Button -->
      <a href="/restaurant-menu" class="portal-btn btn-restaurant" id="btn-restaurant-choice">
        <span class="portal-btn-icon">🍽️</span>
        <span class="portal-btn-text">
          <span class="lang-ar">اطلب من المطعم</span>
          <span class="lang-en">Order from Restaurant</span>
        </span>
      </a>

    </div>

  </main>

  <!-- Clean Footer -->
  <footer class="portal-footer">
    <span class="lang-ar">© ٢٠٢٦ فندق ومقهى أوز بارك — جميع الحقوق محفوظة</span>
    <span class="lang-en">© 2026 OZ Park Hotel & Dining — All rights reserved</span>
  </footer>

  <script>
    // Language Toggle Handling
    (function() {
      var currentLang = localStorage.getItem('oz_park_portal_lang') || 'ar';
      applyLang(currentLang);

      var btn = document.getElementById('lang-switch-btn');
      if (btn) {
        btn.addEventListener('click', function() {
          currentLang = (currentLang === 'ar') ? 'en' : 'ar';
          localStorage.setItem('oz_park_portal_lang', currentLang);
          applyLang(currentLang);
        });
      }

      function applyLang(lang) {
        document.documentElement.lang = lang;
        document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      }
    })();
  </script>

</body>
</html>
